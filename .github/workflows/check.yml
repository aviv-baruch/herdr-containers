name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: herdr-containers
      - uses: actions/checkout@v4
        with:
          repository: herdrdev/herdr-app
          ref: 36725d47c89cd19345994363d6d9cdee5c42c80b # v0.1.10
          path: herdr-app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check package
        working-directory: herdr-containers
        run: sh tools/check.sh
