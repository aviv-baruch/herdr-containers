name: check

# Owner-started only: a push to main or a manual run. No pull_request trigger,
# so PRs (including forks) never run CI. Dispatch it on a PR branch to check it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Defense in depth: skip runs not started by the repo owner.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          path: herdr-containers
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          repository: herdrdev/herdr-app
          ref: 36725d47c89cd19345994363d6d9cdee5c42c80b # v0.1.10
          path: herdr-app
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # tag=v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # tag=v7.1.0
        with:
          node-version: '22'
      - name: Check package
        working-directory: herdr-containers
        run: sh tools/check.sh
