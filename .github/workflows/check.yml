name: check

# Owner-started only: a push to main or a manual run. No pull_request trigger,
# so PRs (including forks) never run CI. Dispatch it on a PR branch to check it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Defense in depth: skip runs not started by the repo owner.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag=v4.4.0
        with:
          path: herdr-containers
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag=v4.4.0
        with:
          repository: herdrdev/herdr-app
          ref: 36725d47c89cd19345994363d6d9cdee5c42c80b # v0.1.10
          path: herdr-app
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag=v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag=v4.4.0
        with:
          node-version: '22'
      - name: Check package
        working-directory: herdr-containers
        run: sh tools/check.sh
